[package]
name = "opennovel-desktop"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
opennovel-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tempfile = "3"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
semver = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
